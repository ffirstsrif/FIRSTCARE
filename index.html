<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', sans-serif;

  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e1b4b 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.hub {
  max-width: 480px; width: 100%; text-align: center;
}
.hub-title {
  font-family: 'Kanit', sans-serif;
  font-size: 28px; font-weight: 800; color: #fff;
  margin-bottom: 6px; letter-spacing: 0.5px;
}
.hub-sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 36px; }

.btn-card {
  display: flex; align-items: center; gap: 16px;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 18px; padding: 22px 26px;
  text-decoration: none; margin-bottom: 14px;
  transition: background 0.18s, transform 0.15s, border-color 0.18s;
  text-align: left;
}
.btn-card:hover {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.4);
  transform: translateY(-2px);
}
.btn-icon {
  font-size: 36px; flex-shrink: 0;
  width: 60px; height: 60px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
}
.icon-blue { background: rgba(37,99,235,0.35); }
.icon-purple { background: rgba(124,58,237,0.35); }
.btn-label {
  font-family: 'Kanit', sans-serif; font-size: 18px; font-weight: 700;
  color: #fff; display: block; margin-bottom: 4px;
}
.btn-desc { font-size: 13px; color: rgba(255,255,255,0.6); }
</style>

    </div>
  </a>

  </a>
</div>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Care - บ้านสะพานหลวง</title>
  
  <!-- นำเข้าฟอนต์ Google Fonts (Kanit & Sarabun) -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="https://i.ibb.co/sJ2PBN1C/S-13139993.jpg">
  <link rel="apple-touch-icon" href="https://i.ibb.co/sJ2PBN1C/S-13139993.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="บ้านสะพานหลวง">  
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary-navy: #0f172a;
      --brand-blue: #1d4ed8;
      --brand-gold: #d97706;
      --bg-gradient-start: #eef2f7;
      --bg-gradient-end: #dbe2ef;
      
      /* สีของการ์ดเมนู */
      --card-cyan-start: #e0f2fe;
      --card-cyan-end: #bae6fd;
      --card-purple-start: #f3e8ff;
      --card-purple-end: #e9d5ff;
      
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* คัลเลอร์บล็อบ (Glowing Blobs) เพิ่มสีสันพื้นหลังให้สวยงามมีมิติ */
    .color-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }
    .blob-pink {
      top: -10%;
      right: -10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #fbcfe8 0%, #f472b6 100%);
    }
    .blob-blue {
      bottom: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #bae6fd 0%, #38bdf8 100%);
    }
    .blob-purple {
      top: 35%;
      left: 15%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #e9d5ff 0%, #c084fc 100%);
    }

    /* เส้นคลื่นกราฟิกดั้งเดิมสีฟ้าคราม */
    .background-waves {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.65;
    }

    /* กล่องคอนเทนเนอร์หลักแนว Glassmorphism */
    .container {
      max-width: 540px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 36px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12);
      z-index: 3;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =======================================
       ส่วนหัวเด่นตระการตา: โลโก้บ้านสะพานหลวง (บนสุด)
       ======================================= */
    .top-brand-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px dashed rgba(15, 23, 42, 0.08);
    }

    .bridge-logo-wrapper {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      width: 80px;
      height: 80px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 20px rgba(15, 23, 42, 0.25);
      margin-bottom: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }
    .top-brand-badge:hover .bridge-logo-wrapper {
      transform: translateY(-4px) rotate(3deg);
    }

    .bridge-logo-wrapper svg {
      width: 58px;
      height: 38px;
    }

    .brand-title-th {
      font-family: 'Kanit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .brand-title-en {
      font-family: 'Kanit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #ea580c;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }


    /* =======================================
       แบรนด์ FIRST CARE และสโลแกน
       ======================================= */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-title-main {
      font-family: 'Kanit', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: #1e3a8a;
      line-height: 1;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 6px;
      background: linear-gradient(to right, #1e3a8a, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle-main {
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* ภาพผู้สูงอายุชายหญิงจากต้นฉบับ */
    .illustration-box {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }

    .illustration-box svg {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.06));
    }

    .slogan {
      font-family: 'Kanit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-top: 12px;
      line-height: 1.4;
    }

    .slogan-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 10px;
    }


    /* =======================================
       ปุ่มเลือกโหมดการทำงาน (2 คอลัมน์)
       ======================================= */
    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 480px) {
      .grid-menu {
        grid-template-columns: 1fr;
      }
    }

    .menu-card {
      text-decoration: none;
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.03);
    }

    /* การ์ดตารางทำงาน (สีฟ้าพาสเทล) */
    .card-cyan {
      background: linear-gradient(135deg, var(--card-cyan-start) 0%, var(--card-cyan-end) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }

    .card-cyan:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 30px rgba(56, 189, 248, 0.4);
      border-color: rgba(56, 189, 248, 0.7);
    }

    /* การ์ดคำนวณค่าบริการ (สีม่วงพาสเทล) */
    .card-purple {
      background: linear-gradient(135deg, var(--card-purple-start) 0%, var(--card-purple-end) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }

    .card-purple:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 30px rgba(192, 132, 252, 0.4);
      border-color: rgba(192, 132, 252, 0.7);
    }

    .icon-wrapper {
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.05));
      transition: transform 0.3s ease;
    }

    .menu-card:hover .icon-wrapper {
      transform: scale(1.1) rotate(2deg);
    }

    .card-title {
      font-family: 'Kanit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12px;
      color: #475569;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- บล็อบสีสร้างสีสันบรรยากาศโฉมใหม่ด้านหลัง -->
  <div class="color-blob blob-pink"></div>
  <div class="color-blob blob-blue"></div>
